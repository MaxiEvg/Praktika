{% extends "base.html" %}
{% block content %}
<div class="container mt-5">
  <h1>Планы адаптации</h1>
  <a href="{{ url_for('create_plan_form') }}" class="btn btn-primary mb-3">Новый план</a>
  <ul class="list-group">
    {% for p in plans %}
    <li class="list-group-item d-flex justify-content-between align-items-center">
      <a href="{{ url_for('plan_detail', plan_id=p.id) }}">{{ p.name }}</a>
      <div>
        <a href="{{ url_for('edit_plan_form', plan_id=p.id) }}" class="btn btn-sm btn-outline-secondary">Ред.</a>
        <form method="post" action="{{ url_for('delete_plan', plan_id=p.id) }}" style="display:inline">
          <button type="submit" class="btn btn-sm btn-outline-danger">Удалить</button>
        </form>
      </div>
    </li>
    {% endfor %}
  </ul>
</div>
{% endblock %}
