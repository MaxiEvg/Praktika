{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
  <h1>Панель управления, {{ user.username }}</h1>

  <h3 class="mt-4">Недавние тесты</h3>
  <ul class="list-group mb-4">
    {% for t in recent_tests %}
      <li class="list-group-item">
        <a href="/tests/{{ t.id }}">{{ t.title }}</a>
      </li>
    {% else %}
      <li class="list-group-item">Нет тестов</li>
    {% endfor %}
  </ul>

  <div class="row">
    <!-- ваши карточки -->
  </div>
</div>
{% endblock %}
