{% extends "base.html" %}
{% block content %}
<div class="container mt-5">
  <h1>Пользователи</h1>

  <div class="mb-3">
    <label for="userSelect" class="form-label">Выберите пользователя:</label>
    <select id="userSelect" class="form-select">
      <option value="" selected disabled>-- выбор --</option>
      {% for u in employees %}
        <option value="{{ u.id }}">{{ u.last_name }} {{ u.first_name }}</option>
      {% endfor %}
    </select>
  </div>

  <div id="userInfo" class="card mb-3" style="display:none;">
    <div class="card-body">
      <h5 class="card-title" id="infoName"></h5>
      <p><strong>Email:</strong> <span id="infoEmail"></span></p>
      <p><strong>Департамент:</strong> <span id="infoDept"></span></p>
      <p><strong>Позиция:</strong> <span id="infoPos"></span></p>
    </div>
  </div>

  <button id="addPlanBtn" class="btn btn-primary mb-3" style="display:none;">
    Назначить план
  </button>

  <div id="planSection" style="display:none;">
    <h3>Адаптационные планы</h3>
    <ul class="list-group" id="planList"></ul>
  </div>
</div>

<script>
  const users = {{ employees_json|tojson }};
  let selectedId = null;

  const select = document.getElementById('userSelect'),
        infoCard = document.getElementById('userInfo'),
        infoName = document.getElementById('infoName'),
        infoEmail = document.getElementById('infoEmail'),
        infoDept  = document.getElementById('infoDept'),
        infoPos   = document.getElementById('infoPos'),
        addBtn    = document.getElementById('addPlanBtn'),
        planSect  = document.getElementById('planSection'),
        planList  = document.getElementById('planList');

  select.addEventListener('change', () => {
    selectedId = +select.value;
    const u = users.find(x => x.id === selectedId);
    if (!u) return;

    infoName.textContent  = u.last_name + ' ' + u.first_name;
    infoEmail.textContent = u.email || '-';
    infoDept.textContent  = u.department || '-';
    infoPos.textContent   = u.position || '-';

    infoCard.style.display = 'block';
    addBtn.style.display   = 'inline-block';
    planSect.style.display = 'block';

    // render plans
    planList.innerHTML = '';
    if (!u.plans.length) {
      planList.innerHTML = '<li class="list-group-item">Нет планов</li>';
    } else {
      u.plans.forEach(p => {
        const li = document.createElement('li');
        li.className = 'list-group-item d-flex justify-content-between';
        li.textContent = p.name;
        const btn = document.createElement('button');
        btn.className = 'btn btn-sm btn-outline-secondary';
        btn.textContent = 'Прогресс';
        btn.onclick = () => location.href = `/users/${selectedId}/progress/${p.id}`;
        li.appendChild(btn);
        planList.appendChild(li);
      });
    }
  });

  addBtn.addEventListener('click', () => {
    if (selectedId) {
      location.href = `/users/${selectedId}/plans/add`;
    }
  });
</script>
{% endblock %}
