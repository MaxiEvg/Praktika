{% extends "base.html" %}

{% block content %}
<div class="d-flex">
  <aside class="me-4" style="width: 200px; position: sticky; top: 20px;">
    <ul class="list-group" id="question-nav">
      {% for i in range(1, question_count + 1) %}
      <li class="list-group-item"><a href="#q{{ i }}" class="nav-link">Вопрос {{ i }}</a></li>
      {% endfor %}
    </ul>
  </aside>
  <div class="flex-fill">
    <h1 class="mb-4">Редактирование теста</h1>

    <form id="test-form" enctype="multipart/form-data">
      <input type="hidden" name="test_id" value="{{ test.id }}">

      <div class="mb-3">
        <label for="title" class="form-label">Название теста</label>
        <input
          type="text"
          id="title"
          class="form-control"
          name="title"
          value="{{ test.title }}"
          required
        >
      </div>
      <div class="mb-3">
        <label for="description" class="form-label">Описание</label>
        <textarea
          id="description"
          class="form-control"
          name="description"
          rows="3"
        >{{ test.description }}</textarea>
      </div>

      <div id="questions-container" class="accordion"></div>

      <div class="d-flex justify-content-between mt-4">
        <button type="button" class="btn btn-outline-primary" id="add-question-btn">
          Добавить вопрос
        </button>
        <button type="submit" class="btn btn-success">Сохранить</button>
      </div>
    </form>
  </div>
</div>

<script>
let questionCount = {{ question_count }};
let questionsData = {{ questions_data|tojson }};

function updateNav() {
  const nav = document.getElementById('question-nav');
  nav.innerHTML = '';
  for (let i = 1; i <= questionCount; i++) {
    const li = document.createElement('li');
    li.className = 'list-group-item';
    li.innerHTML = `<a href="#q${i}" class="text-decoration-none">Вопрос ${i}</a>`;
    nav.appendChild(li);
  }
}

function renderQuestion(idx, data={text:'', answers:[{text:'', correct:false}], image_path:null}) {
  const item = document.createElement('div');
  item.className = 'accordion-item mb-3';
  item.id = `q${idx}`;
  item.innerHTML = `
    <h2 class="accordion-header" id="heading${idx}">
      <button class="accordion-button collapsed" type="button"
        data-bs-toggle="collapse" data-bs-target="#collapse${idx}"
        aria-expanded="false">
        Вопрос ${idx}
      </button>
    </h2>
    <div id="collapse${idx}" class="accordion-collapse collapse">
      <div class="accordion-body">
        <div class="mb-3">
          <label class="form-label">Текст вопроса</label>
          <input type="text" name="q_${idx}_text" class="form-control"
            value="${data.text}" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Изображение (необязательно)</label>
          <input type="file" name="q_${idx}_image" class="form-control mb-2">
          ${data.image_path ? `<img src="/static/${data.image_path}" class="img-fluid rounded mt-2">` : ''}
        </div>
        <div class="mb-3">
          <label class="form-label">Варианты ответов</label>
          <div id="answers-${idx}"></div>
          <button type="button" class="btn btn-sm btn-secondary mt-2"
            onclick="addAnswer(${idx})">Добавить ответ</button>
        </div>
        <div class="text-end">
          <button type="button" class="btn btn-outline-danger"
            onclick="removeQuestion(${idx})">Удалить вопрос</button>
        </div>
      </div>
    </div>
  `;
  return item;
}

function addAnswer(qidx, text='', correct=false) {
  const container = document.getElementById(`answers-${qidx}`);
  const aidx = container.children.length;
  const group = document.createElement('div');
  group.className = 'input-group mb-2';
  group.innerHTML = `
    <span class="input-group-text">
      <input type="radio" name="q_${qidx}_correct" value="${aidx}" ${correct ? 'checked' : ''}>
    </span>
    <input type="text" name="q_${qidx}_a_${aidx}" class="form-control"
      placeholder="Текст ответа" value="${text}" required>
    <button type="button" class="btn btn-outline-danger"
      onclick="this.closest('.input-group').remove()">×</button>
  `;
  container.appendChild(group);
}

function removeQuestion(idx) {
  if (!confirm('Удалить этот вопрос?')) return;
  const container = document.getElementById('questions-container');
  container.removeChild(document.getElementById(`q${idx}`));
  rebuildQuestions();
}

function rebuildQuestions() {
  const container = document.getElementById('questions-container');
  const items = Array.from(container.children);
  questionCount = items.length;
  container.innerHTML = '';
  items.forEach((_, i) => {
    container.appendChild(renderQuestion(i + 1));
  });
  updateNav();
}

window.addEventListener('DOMContentLoaded', () => {
  const container = document.getElementById('questions-container');
  if (questionsData.length) {
    questionsData.forEach((q, idx) => {
      questionCount = idx + 1;
      container.appendChild(renderQuestion(questionCount, q));
      q.answers.forEach((text, i) => {
        addAnswer(questionCount, text, i === q.correct);
      });
    });
  }
  updateNav();
  document.getElementById('add-question-btn').onclick = () => {
    questionCount++;
    container.appendChild(renderQuestion(questionCount));
    updateNav();
  };
});

document.getElementById('test-form').onsubmit = async e => {
  e.preventDefault();
  const fd = new FormData(e.target);
  const questions = [];
  for (let i = 1; i <= questionCount; i++) {
    const text = fd.get(`q_${i}_text`);
    const correct = +fd.get(`q_${i}_correct`);
    const answers = [];
    document.querySelectorAll(`#answers-${i} input[type=text]`).forEach(inp => answers.push(inp.value));
    questions.push({
      text,
      answers,
      correct,
      image_field: fd.get(`q_${i}_image`)
    });
  }
  fd.set('questions_data', JSON.stringify(questions));
  try {
    const resp = await fetch('/tests/', { method: 'POST', body: fd });
    if (resp.ok) location.href = `/tests/{{ test.id }}`;
    else alert('Ошибка при сохранении');
  } catch {
    alert('Сетевая ошибка');
  }
};
</script>
{% endblock %}
