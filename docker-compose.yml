services:
  postgres:
    image: postgres:13-alpine
    container_name: my_postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
      - POSTGRES_DB=${POSTGRES_DB:-AdaptaCore}
      - POSTGRES_HOST_AUTH_METHOD=trust
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-AdaptaCore}"]
      interval: 5s
      timeout: 5s
      retries: 5
    command: postgres -c max_connections=1000 -c shared_buffers=256MB

  admin:
    build:
      context: .
      dockerfile: Dockerfile.admin
    container_name: admin
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-AdaptaCore}
      - API_PREFIX=/api/v1
      - HOST=0.0.0.0
      - PORT=8080
      - RUN__HOST=0.0.0.0
      - RUN__PORT=8080
    ports:
      - "8080:8080"
    volumes:
      - ./admin:/app
      - ./static:/app/static
    working_dir: /app
    command: python main.py

  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    container_name: bot
    depends_on:
      - admin
    env_file:
      - .\admin\.env
    environment:
      - API_BASE_URL=http://admin:8080/api/v1
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FILE=/app/bot.log
      - POSTGRES_USER=${POSTGRES_USER:-user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DB=${POSTGRES_DB:-AdaptaCore}
    volumes:
      - ./:/app
      - ./bot.log:/app/bot.log
    working_dir: /app

volumes:
  postgres_data: